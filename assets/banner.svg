<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#120e2e"/>
      <stop offset="100%" stop-color="#070919"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="film-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#311042" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="blur-bg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
  </defs>

  <style>
    /* Animated Keyframes */
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, -30px) scale(1.15); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-50px, 40px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes floatOrb3 {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(40px, 35px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes pulseWave {
      0%, 100% { opacity: 0.25; stroke-dashoffset: 0; }
      50% { opacity: 0.65; stroke-dashoffset: 40; }
    }
    @keyframes pillFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes pillFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes filmRoll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-80px); }
    }
    @keyframes scanline {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.5; }
      100% { transform: translateY(420px); opacity: 0.2; }
    }

    .orb-1 { animation: floatOrb1 14s ease-in-out infinite; }
    .orb-2 { animation: floatOrb2 18s ease-in-out infinite; }
    .orb-3 { animation: floatOrb3 12s ease-in-out infinite; }
    .pulse-line { stroke-dasharray: 8 6; animation: pulseWave 6s ease-in-out infinite; }
    .pill-group-1 { animation: pillFloat1 5s ease-in-out infinite; }
    .pill-group-2 { animation: pillFloat2 6s ease-in-out infinite; }
    .scan-beam { animation: scanline 8s linear infinite; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="18"/>

  <!-- Subtle Perspective Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="340" x2="1200" y2="340"/>
    <line x1="120" y1="0" x2="120" y2="420"/>
    <line x1="280" y1="0" x2="280" y2="420"/>
    <line x1="440" y1="0" x2="440" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="760" y1="0" x2="760" y2="420"/>
    <line x1="920" y1="0" x2="920" y2="420"/>
    <line x1="1080" y1="0" x2="1080" y2="420"/>
  </g>

  <!-- Dynamic Animated Glowing Orbs (Strictly Background) -->
  <g filter="url(#blur-bg)" opacity="0.45">
    <circle class="orb-1" cx="220" cy="110" r="130" fill="#38bdf8"/>
    <circle class="orb-2" cx="980" cy="140" r="140" fill="#a855f7"/>
    <circle class="orb-3" cx="600" cy="350" r="110" fill="#ec4899"/>
  </g>

  <!-- Dynamic Curved Motion Waves / Cinematic Camera Trajectory Lines -->
  <path class="pulse-line" d="M -50 320 Q 300 240 600 330 T 1250 250" fill="none" stroke="url(#film-grad)" stroke-width="2.5"/>
  <path class="pulse-line" d="M -50 110 Q 350 40 700 130 T 1250 80" fill="none" stroke="url(#film-grad)" stroke-width="1.8"/>

  <!-- Scanning Light Line across Canvas -->
  <line class="scan-beam" x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Top Cinema Film Reel Border Indicator -->
  <g opacity="0.35">
    <rect x="30" y="22" width="1140" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- Film Perforations -->
    <rect x="50" y="26" width="18" height="12" rx="2" fill="#38bdf8"/>
    <rect x="110" y="26" width="18" height="12" rx="2" fill="#38bdf8"/>
    <rect x="170" y="26" width="18" height="12" rx="2" fill="#38bdf8"/>
    <rect x="230" y="26" width="18" height="12" rx="2" fill="#38bdf8"/>
    <rect x="290" y="26" width="18" height="12" rx="2" fill="#818cf8"/>
    <rect x="350" y="26" width="18" height="12" rx="2" fill="#818cf8"/>
    <rect x="410" y="26" width="18" height="12" rx="2" fill="#818cf8"/>
    <rect x="470" y="26" width="18" height="12" rx="2" fill="#a855f7"/>
    <rect x="530" y="26" width="18" height="12" rx="2" fill="#a855f7"/>
    <rect x="590" y="26" width="18" height="12" rx="2" fill="#a855f7"/>
    <rect x="650" y="26" width="18" height="12" rx="2" fill="#c084fc"/>
    <rect x="710" y="26" width="18" height="12" rx="2" fill="#c084fc"/>
    <rect x="770" y="26" width="18" height="12" rx="2" fill="#ec4899"/>
    <rect x="830" y="26" width="18" height="12" rx="2" fill="#ec4899"/>
    <rect x="890" y="26" width="18" height="12" rx="2" fill="#ec4899"/>
    <rect x="950" y="26" width="18" height="12" rx="2" fill="#f43f5e"/>
    <rect x="1010" y="26" width="18" height="12" rx="2" fill="#f43f5e"/>
    <rect x="1070" y="26" width="18" height="12" rx="2" fill="#f43f5e"/>
    <rect x="1130" y="26" width="18" height="12" rx="2" fill="#38bdf8"/>
  </g>

  <!-- FOREGROUND LAYER: Unobstructed High-Visibility Typography -->
  <!-- Header Title -->
  <g text-anchor="middle">
    <!-- Camera Clapper Icon Accent -->
    <text x="600" y="115" font-size="34">🎬 ⚡ 🎥</text>
    
    <!-- Main Title -->
    <text x="600" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#title-grad)" filter="url(#glow)" letter-spacing="1.2">
      AWESOME AI VIDEO GENERATION
    </text>
    <text x="600" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="3.5">
      &amp; VIDEO RE-SHOOTING
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="url(#sub-grad)" letter-spacing="0.5">
      The Ultimate Curated Hub for Foundation Models • Shot-Transfer &amp; Motion Control • Production Pipelines • Commercial SaaS
    </text>
  </g>

  <!-- Floating Feature Badges / Technology Pills (Positioned Safely Along Bottom) -->
  <!-- Pill 1: Wan2.2 & DiT -->
  <g class="pill-group-1">
    <g transform="translate(100, 315)">
      <rect width="185" height="42" rx="21" fill="url(#badge-grad)" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="24" cy="21" r="7" fill="#38bdf8"/>
      <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Wan2.2 &amp; DiT Models</text>
    </g>
  </g>

  <!-- Pill 2: Shot-Transfer / ReShot -->
  <g class="pill-group-2">
    <g transform="translate(315, 315)">
      <rect width="215" height="42" rx="21" fill="url(#badge-grad)" stroke="#818cf8" stroke-width="1.2"/>
      <circle cx="24" cy="21" r="7" fill="#818cf8"/>
      <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">ReShot &amp; Motion Control</text>
    </g>
  </g>

  <!-- Pill 3: ComfyUI Orchestration -->
  <g class="pill-group-1">
    <g transform="translate(560, 315)">
      <rect width="200" height="42" rx="21" fill="url(#badge-grad)" stroke="#c084fc" stroke-width="1.2"/>
      <circle cx="24" cy="21" r="7" fill="#c084fc"/>
      <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">ComfyUI Production</text>
    </g>
  </g>

  <!-- Pill 4: Character & LipSync -->
  <g class="pill-group-2">
    <g transform="translate(790, 315)">
      <rect width="205" height="42" rx="21" fill="url(#badge-grad)" stroke="#ec4899" stroke-width="1.2"/>
      <circle cx="24" cy="21" r="7" fill="#ec4899"/>
      <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">LivePortrait &amp; Avatars</text>
    </g>
  </g>

  <!-- Pill 5: Commercial SaaS Matrix -->
  <g class="pill-group-1">
    <g transform="translate(1025, 315)">
      <rect width="130" height="42" rx="21" fill="url(#badge-grad)" stroke="#f43f5e" stroke-width="1.2"/>
      <circle cx="20" cy="21" r="7" fill="#f43f5e"/>
      <text x="35" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">SaaS Matrix</text>
    </g>
  </g>

  <!-- Subtle Bottom Film Edge Accent -->
  <rect x="30" y="385" width="1140" height="6" rx="3" fill="#1e293b"/>
  <rect x="250" y="385" width="700" height="6" rx="3" fill="url(#film-grad)" opacity="0.7"/>
</svg>
